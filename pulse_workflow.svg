<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05060b"/>
      <stop offset="50%" stop-color="#0b0e18"/>
      <stop offset="100%" stop-color="#030407"/>
    </linearGradient>

    <linearGradient id="goldPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>

    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <pattern id="nodeGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="rgba(255, 255, 255, 0.08)"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad4)"/>
  <rect width="800" height="500" fill="url(#nodeGrid)"/>

  <!-- Workflow Connection Lines -->
  <path d="M 210 250 C 270 250, 270 160, 340 160" fill="none" stroke="url(#goldPulse)" stroke-width="3" filter="url(#nodeGlow)"/>
  <path d="M 210 250 C 270 250, 270 340, 340 340" fill="none" stroke="url(#goldPulse)" stroke-width="3" filter="url(#nodeGlow)"/>
  <path d="M 480 160 C 550 160, 550 250, 600 250" fill="none" stroke="#06b6d4" stroke-width="3"/>
  <path d="M 480 340 C 550 340, 550 250, 600 250" fill="none" stroke="#06b6d4" stroke-width="3"/>

  <!-- Animated Pulse Dots along paths -->
  <circle cx="275" cy="205" r="5" fill="#ffffff" filter="url(#nodeGlow)">
    <animate attributeName="cx" values="210;340;210" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="250;160;250" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Node 1: Webhook Trigger (Left) -->
  <g transform="translate(60, 200)">
    <rect x="0" y="0" width="150" height="100" rx="14" fill="rgba(15, 18, 30, 0.85)" stroke="url(#goldPulse)" stroke-width="1.5"/>
    <rect x="12" y="12" width="24" height="24" rx="6" fill="rgba(212, 175, 55, 0.2)"/>
    <text x="20" y="28" font-family="sans-serif" font-size="12" fill="#f5d77f">⚡</text>

    <text x="44" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">WEBHOOK IN</text>
    <text x="12" y="55" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">POST /api/v1/events</text>
    
    <rect x="12" y="68" width="65" height="18" rx="9" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="22" y="81" font-family="sans-serif" font-size="9" font-weight="700" fill="#34d399">200 OK</text>
  </g>

  <!-- Node 2: AI Decision Engine (Top Middle) -->
  <g transform="translate(330, 110)">
    <rect x="0" y="0" width="150" height="100" rx="14" fill="rgba(15, 18, 30, 0.85)" stroke="url(#goldPulse)" stroke-width="2" filter="url(#nodeGlow)"/>
    <text x="14" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#f5d77f">🧠 AI PARSER</text>
    <text x="14" y="55" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">Model: GPT-4o / Claude</text>

    <rect x="14" y="68" width="90" height="18" rx="9" fill="rgba(212, 175, 55, 0.2)"/>
    <text x="22" y="81" font-family="sans-serif" font-size="9" font-weight="700" fill="#f5d77f">LATENCE 18ms</text>
  </g>

  <!-- Node 3: Redis Queue (Bottom Middle) -->
  <g transform="translate(330, 290)">
    <rect x="0" y="0" width="150" height="100" rx="14" fill="rgba(15, 18, 30, 0.85)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <text x="14" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#06b6d4">📦 REDIS QUEUE</text>
    <text x="14" y="55" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">Priority: High</text>

    <rect x="14" y="68" width="80" height="18" rx="9" fill="rgba(6, 182, 212, 0.15)"/>
    <text x="22" y="81" font-family="sans-serif" font-size="9" font-weight="700" fill="#06b6d4">4.2k ops/sec</text>
  </g>

  <!-- Node 4: Database Sync Output (Right) -->
  <g transform="translate(590, 200)">
    <rect x="0" y="0" width="150" height="100" rx="14" fill="rgba(15, 18, 30, 0.85)" stroke="#34d399" stroke-width="1.5"/>
    <text x="14" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#34d399">💾 SYNC POSTGRES</text>
    <text x="14" y="55" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">Table: telemetry_log</text>

    <rect x="14" y="68" width="105" height="18" rx="9" fill="rgba(16, 185, 129, 0.2)"/>
    <text x="22" y="81" font-family="sans-serif" font-size="9" font-weight="700" fill="#34d399">COMMITTED ✓</text>
  </g>
</svg>
