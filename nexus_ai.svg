<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="50%" stop-color="#090d1a"/>
      <stop offset="100%" stop-color="#030407"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9a7b38"/>
    </linearGradient>

    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- Glowing Orbs -->
  <circle cx="650" cy="120" r="180" fill="#d4af37" opacity="0.08" filter="blur(60px)"/>
  <circle cx="150" cy="380" r="160" fill="#06b6d4" opacity="0.08" filter="blur(60px)"/>

  <!-- Main Dashboard Glass Window -->
  <rect x="40" y="40" width="720" height="420" rx="16" fill="rgba(15, 18, 30, 0.75)" stroke="rgba(212, 175, 55, 0.3)" stroke-width="1.5"/>

  <!-- Top Bar -->
  <rect x="40" y="40" width="720" height="54" rx="16" fill="rgba(255, 255, 255, 0.03)"/>
  <circle cx="70" cy="67" r="6" fill="#ef4444"/>
  <circle cx="90" cy="67" r="6" fill="#f59e0b"/>
  <circle cx="110" cy="67" r="6" fill="#10b981"/>

  <text x="140" y="72" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#f5d77f" letter-spacing="1">NEXUS AI ANALYTICS v4.2</text>

  <rect x="580" y="55" width="160" height="26" rx="13" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1"/>
  <circle cx="598" cy="68" r="4" fill="#10b981"/>
  <text x="610" y="72" font-family="sans-serif" font-size="11" font-weight="600" fill="#34d399">● LIVE TELEMETRY</text>

  <!-- Left Stats Cards -->
  <g transform="translate(65, 120)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="200" height="95" rx="12" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.08)"/>
    <text x="16" y="28" font-family="sans-serif" font-size="12" fill="rgba(255, 255, 255, 0.5)">LATENCE API MÉDIANE</text>
    <text x="16" y="65" font-family="'Space Grotesk', sans-serif" font-size="30" font-weight="700" fill="#ffffff">28 ms</text>
    <text x="135" y="65" font-family="sans-serif" font-size="12" font-weight="700" fill="#34d399">↓ -42%</text>

    <!-- Card 2 -->
    <rect x="0" y="115" width="200" height="95" rx="12" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.08)"/>
    <text x="16" y="143" font-family="sans-serif" font-size="12" fill="rgba(255, 255, 255, 0.5)">REQUÊTES / SEC</text>
    <text x="16" y="180" font-family="'Space Grotesk', sans-serif" font-size="30" font-weight="700" fill="#f5d77f">48.6k</text>
    <text x="135" y="180" font-family="sans-serif" font-size="12" font-weight="700" fill="#f5d77f">⚡ MAX</text>

    <!-- Card 3 -->
    <rect x="0" y="230" width="200" height="95" rx="12" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(212, 175, 55, 0.25)"/>
    <text x="16" y="258" font-family="sans-serif" font-size="12" fill="rgba(255, 255, 255, 0.5)">DISPONIBILITÉ SLA</text>
    <text x="16" y="295" font-family="'Space Grotesk', sans-serif" font-size="30" font-weight="700" fill="#ffffff">99.99%</text>
  </g>

  <!-- Right Chart Window -->
  <g transform="translate(290, 120)">
    <rect x="0" y="0" width="445" height="325" rx="14" fill="rgba(0, 0, 0, 0.3)" stroke="rgba(212, 175, 55, 0.2)"/>
    <text x="20" y="32" font-family="sans-serif" font-size="13" font-weight="700" fill="#f5d77f">FLUX D'APPRENTISSAGETemps Réel (Model AI-V4)</text>

    <!-- Chart Grid -->
    <line x1="20" y1="70" x2="425" y2="70" stroke="rgba(255,255,255,0.05)"/>
    <line x1="20" y1="130" x2="425" y2="130" stroke="rgba(255,255,255,0.05)"/>
    <line x1="20" y1="190" x2="425" y2="190" stroke="rgba(255,255,255,0.05)"/>
    <line x1="20" y1="250" x2="425" y2="250" stroke="rgba(255,255,255,0.05)"/>

    <!-- Area & Line Graph -->
    <path d="M 20 230 Q 80 180, 140 210 T 260 120 T 360 80 L 425 110 L 425 280 L 20 280 Z" fill="url(#areaGrad)"/>
    <path d="M 20 230 Q 80 180, 140 210 T 260 120 T 360 80 L 425 110" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" filter="url(#goldGlow)"/>

    <!-- Data Nodes -->
    <circle cx="140" cy="210" r="5" fill="#f5d77f" stroke="#000" stroke-width="2"/>
    <circle cx="260" cy="120" r="5" fill="#f5d77f" stroke="#000" stroke-width="2"/>
    <circle cx="360" cy="80" r="7" fill="#ffffff" stroke="#d4af37" stroke-width="3" filter="url(#goldGlow)"/>

    <!-- Floating Tooltip -->
    <rect x="300" y="30" width="110" height="40" rx="8" fill="rgba(9, 12, 22, 0.9)" stroke="#d4af37" stroke-width="1"/>
    <text x="312" y="48" font-family="sans-serif" font-size="10" fill="#a0aec0">PRÉDICTION</text>
    <text x="312" y="62" font-family="sans-serif" font-size="13" font-weight="700" fill="#f5d77f">+140.2% ROI</text>
  </g>
</svg>
