<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060d"/>
      <stop offset="50%" stop-color="#0a0e1c"/>
      <stop offset="100%" stop-color="#020306"/>
    </linearGradient>

    <linearGradient id="goldFin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>

    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c233a"/>
      <stop offset="100%" stop-color="#0d111e"/>
    </linearGradient>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad3)"/>

  <!-- Grid Lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- Left Side: VIP Bank Card -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="340" height="210" rx="18" fill="url(#cardGrad)" stroke="url(#goldFin)" stroke-width="1.5"/>
    <circle cx="280" cy="150" r="45" fill="#06b6d4" opacity="0.12" filter="url(#cyanGlow)"/>

    <!-- EMV Chip -->
    <rect x="30" y="35" width="42" height="32" rx="6" fill="url(#goldFin)"/>
    <line x1="30" y1="51" x2="72" y2="51" stroke="#000" stroke-width="1"/>
    <line x1="51" y1="35" x2="51" y2="67" stroke="#000" stroke-width="1"/>

    <!-- Card Brand & Details -->
    <text x="300" y="45" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="url(#goldFin)" text-anchor="end">VANGUARD VIP</text>
    <text x="30" y="125" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" fill="#ffffff" letter-spacing="3">•••• •••• •••• 8888</text>
    
    <text x="30" y="170" font-family="sans-serif" font-size="9" fill="rgba(255,255,255,0.5)">TITULAIRE DU COMPTE</text>
    <text x="30" y="185" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">MOUSSA SAYAH</text>

    <text x="240" y="170" font-family="sans-serif" font-size="9" fill="rgba(255,255,255,0.5)">EXPIRATION</text>
    <text x="240" y="185" font-family="sans-serif" font-size="12" font-weight="700" fill="#f5d77f">12/28</text>
  </g>

  <!-- Right Side: Real-Time Crypto & Stock Chart -->
  <g transform="translate(440, 90)">
    <rect x="0" y="0" width="300" height="320" rx="16" fill="rgba(15, 18, 30, 0.75)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1"/>
    <text x="20" y="32" font-family="sans-serif" font-size="12" font-weight="700" fill="#06b6d4" letter-spacing="1">PORTFEUILLE ACTIFS MULTI-CURRENCY</text>
    
    <text x="20" y="68" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700" fill="#ffffff">$2 845 900.00</text>
    <text x="230" y="68" font-family="sans-serif" font-size="12" font-weight="700" fill="#34d399">+18.4% ↑</text>

    <!-- Candlestick / Line Chart -->
    <path d="M 20 220 L 70 190 L 120 230 L 170 140 L 220 160 L 270 100" fill="none" stroke="url(#cyanLine)" stroke-width="3" filter="url(#cyanGlow)"/>
    <path d="M 20 220 L 70 190 L 120 230 L 170 140 L 220 160 L 270 100 L 270 260 L 20 260 Z" fill="rgba(6, 182, 212, 0.1)"/>

    <circle cx="270" cy="100" r="5" fill="#06b6d4" stroke="#ffffff" stroke-width="2"/>

    <!-- Asset Rows -->
    <g transform="translate(20, 270)">
      <circle cx="10" cy="10" r="8" fill="#f5d77f"/>
      <text x="26" y="14" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff">BTC / USD</text>
      <text x="230" y="14" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="end">$68,450.00</text>
    </g>
  </g>
</svg>
