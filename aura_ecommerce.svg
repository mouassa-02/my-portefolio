<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080d"/>
      <stop offset="50%" stop-color="#121019"/>
      <stop offset="100%" stop-color="#040407"/>
    </linearGradient>

    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcedc5"/>
      <stop offset="30%" stop-color="#f5d77f"/>
      <stop offset="70%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#806222"/>
    </linearGradient>

    <radialGradient id="spotlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5d77f" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="watchGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad2)"/>
  <circle cx="400" cy="250" r="280" fill="url(#spotlight)"/>

  <!-- Web Header UI -->
  <rect x="40" y="30" width="720" height="50" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(212,175,55,0.2)"/>
  <text x="70" y="60" font-family="'Cormorant Garamond', serif" font-size="20" font-weight="700" fill="url(#goldMetallic)" letter-spacing="3">AURA HAUTE HORLOGERIE</text>
  
  <text x="500" y="60" font-family="sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" letter-spacing="1">COLLECTIONS</text>
  <text x="600" y="60" font-family="sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" letter-spacing="1">MAISON</text>
  
  <rect x="680" y="44" width="60" height="24" rx="12" fill="url(#goldMetallic)"/>
  <text x="698" y="60" font-family="sans-serif" font-size="11" font-weight="700" fill="#000">PANIER</text>

  <!-- 3D Luxury Watch Illustration -->
  <g transform="translate(400, 260)">
    <!-- Watch Strap Top & Bottom -->
    <rect x="-35" y="-190" width="70" height="90" fill="#18151f" rx="8" stroke="rgba(212,175,55,0.3)"/>
    <rect x="-35" y="100" width="70" height="90" fill="#18151f" rx="8" stroke="rgba(212,175,55,0.3)"/>

    <!-- Watch Outer Case -->
    <circle cx="0" cy="0" r="115" fill="#090a10" stroke="url(#goldMetallic)" stroke-width="8" filter="url(#watchGlow)"/>
    <circle cx="0" cy="0" r="102" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

    <!-- Dial Tick Marks -->
    <circle cx="0" cy="0" r="92" fill="#0d0e17" stroke="rgba(212,175,55,0.3)" stroke-width="2"/>
    
    <!-- Hour Markers -->
    <line x1="0" y1="-85" x2="0" y2="-72" stroke="url(#goldMetallic)" stroke-width="4"/>
    <line x1="85" y1="0" x2="72" y2="0" stroke="url(#goldMetallic)" stroke-width="4"/>
    <line x1="0" y1="85" x2="0" y2="72" stroke="url(#goldMetallic)" stroke-width="4"/>
    <line x1="-85" y1="0" x2="-72" y2="0" stroke="url(#goldMetallic)" stroke-width="4"/>

    <!-- Sub-dials -->
    <circle cx="-35" cy="0" r="22" fill="rgba(0,0,0,0.5)" stroke="url(#goldMetallic)" stroke-width="1"/>
    <circle cx="35" cy="0" r="22" fill="rgba(0,0,0,0.5)" stroke="url(#goldMetallic)" stroke-width="1"/>

    <!-- Watch Brand Logo -->
    <text x="0" y="-40" font-family="'Cormorant Garamond', serif" font-size="14" font-weight="700" fill="url(#goldMetallic)" text-anchor="middle" letter-spacing="2">AURA</text>
    <text x="0" y="-28" font-family="sans-serif" font-size="7" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="1">GENÈVE</text>

    <!-- Watch Hands -->
    <!-- Hour Hand -->
    <line x1="0" y1="0" x2="-30" y2="-40" stroke="url(#goldMetallic)" stroke-width="5" stroke-linecap="round"/>
    <!-- Minute Hand -->
    <line x1="0" y1="0" x2="45" y2="-60" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <!-- Center Cap -->
    <circle cx="0" cy="0" r="6" fill="url(#goldMetallic)"/>
  </g>

  <!-- Left Product Information UI Card -->
  <g transform="translate(70, 160)">
    <text x="0" y="20" font-family="sans-serif" font-size="11" font-weight="700" fill="#f5d77f" letter-spacing="2">ÉDITION LIMITÉE N° 08/50</text>
    <text x="0" y="55" font-family="'Cormorant Garamond', serif" font-size="32" font-weight="700" fill="#ffffff">Tourbillon Imperial 18k</text>
    <text x="0" y="90" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700" fill="url(#goldMetallic)">42 500 €</text>
    
    <rect x="0" y="120" width="160" height="42" rx="21" fill="url(#goldMetallic)"/>
    <text x="32" y="146" font-family="sans-serif" font-size="12" font-weight="700" fill="#000">ACQUÉRIR EN 1-CLIC</text>
  </g>

  <!-- Right Floating 3D Badge -->
  <g transform="translate(580, 320)">
    <rect x="0" y="0" width="160" height="90" rx="14" fill="rgba(15, 18, 30, 0.85)" stroke="rgba(212,175,55,0.4)" stroke-width="1"/>
    <text x="20" y="30" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">RENDU 3D WEBGL</text>
    <text x="20" y="52" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">60 FPS Fluide</text>
    <text x="20" y="70" font-family="sans-serif" font-size="11" fill="#34d399">✓ Draco Compressed</text>
  </g>
</svg>
